name: SDK integration
on: [push, pull_request, workflow_dispatch]
jobs:
  instrument:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install SDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libx11-dev libxcb-util-dev libxcb-cursor-dev libxcb-keysyms1-dev libxcb-xkb-dev libxkbcommon-x11-dev libcairo2-dev libfontconfig1-dev libfreetype6-dev libgtkmm-3.0-dev
      - name: Build pinned MIT SDK instrument
        run: |
          git clone --no-checkout https://github.com/steinbergmedia/vst3sdk.git "$RUNNER_TEMP/sdk"
          git -C "$RUNNER_TEMP/sdk" checkout --detach 9fad9770f2ae8542ab1a548a68c1ad1ac690abe0
          git -C "$RUNNER_TEMP/sdk" submodule update --init --recursive
          cmake -S "$RUNNER_TEMP/sdk" -B "$RUNNER_TEMP/sdk-build" -DCMAKE_BUILD_TYPE=Release -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=OFF -DSMTG_CREATE_PLUGIN_LINK=OFF -DSMTG_RUN_VST_VALIDATOR=OFF
          cmake --build "$RUNNER_TEMP/sdk-build" --target note-expression-synth -j2
      - name: Verify Unix SDK binding declarations
        run: python3 tools/verify_sdk_abi.py "$RUNNER_TEMP/sdk"
      - name: Require real lifecycle and audible output
        env:
          REQUIRE_TEST_PLUGIN: '1'
        run: |
          export VST3_TEST_PLUGIN="$RUNNER_TEMP/sdk-build/VST3/Release/note-expression-synth.vst3"
          cargo test --locked --test fixture_plugin_tests -- --nocapture 2>&1 | tee "$RUNNER_TEMP/fixture.log"
          python3 - "$RUNNER_TEMP/fixture.log" <<'PY'
          import pathlib, sys
          log = pathlib.Path(sys.argv[1]).read_text()
          assert '1 passed; 0 failed; 0 ignored;' in log, log
          assert 'SKIPPED:' not in log, log
          PY
          cargo run --locked --example load -- "$VST3_TEST_PLUGIN"
